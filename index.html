<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مصنع الهويات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap">
<style>
:root{--ink:#101828;--desk:#D5DCE6;--soft:#EEF1F6;--blue:#2540FF;--muted:#4B5565;--err:#B42318;--ok:#067647}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--soft);color:var(--ink);font:400 15px/1.65 'Readex Pro',system-ui,sans-serif}
header{display:flex;align-items:center;gap:20px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--ink);position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:20px;font-weight:600;margin:0}
nav{display:flex;gap:4px}
nav button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted)}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
#keybtn{margin-inline-start:auto}
.layout{display:grid;grid-template-columns:350px 1fr;min-height:calc(100vh - 56px)}
.panel{background:#fff;border-inline-end:1px solid var(--ink);padding:18px 18px 40px;display:flex;flex-direction:column;gap:10px}
.desk{background:var(--desk);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
label,.lbl{font-size:13px;color:var(--muted);display:block}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:2px;padding:8px 10px;min-height:40px}
textarea{resize:vertical}
fieldset{border:1px solid var(--ink);border-radius:2px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:13px;color:var(--muted);padding:0 6px}
.btn{font:inherit;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px;padding:8px 14px;min-height:40px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:#1a2fc4}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
.msg{margin:0;min-height:1.4em;font-size:13px;color:var(--muted)}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.small{font-size:12px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal input{width:100%;height:42px;padding:0;border:1px solid var(--ink);border-radius:2px;background:#fff;cursor:pointer}
.pal span{font-size:11px;color:var(--muted);display:block;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex}
.seg button{flex:1;font:inherit;font-size:13px;border:1px solid var(--ink);background:#fff;padding:7px 4px;min-height:38px;cursor:pointer;margin-inline-start:-1px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:4px;max-height:260px;overflow:auto}
.ib{aspect-ratio:1;background:#fff;border:1px solid #C3CAD6;border-radius:2px;display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{border-color:var(--ink)}
.ib[aria-pressed=true]{border:2px solid var(--blue);background:#EEF1FF}
.sheet{background:#fff;border:1px solid var(--ink)}
#board{display:block;width:100%;height:auto}
.els{list-style:none;margin:0;padding:0;border:1px solid var(--ink);background:#fff}
.els li{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #C3CAD6}
.els li:last-child{border-bottom:0}
.els .n{flex:1}
.els .btn{min-height:34px;padding:4px 12px;font-size:13px}
.drop{display:grid;place-items:center;text-align:center;border:2px dashed var(--ink);min-height:150px;padding:14px;cursor:pointer;background:#fff;color:var(--muted)}
.drop.over{border-color:var(--blue);background:#EEF1FF}
.drop input{position:absolute;opacity:0;pointer-events:none}
#srcprev{max-width:100%;max-height:260px;display:block;margin:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cell{background:#fff;border:1px solid var(--ink);display:flex;flex-direction:column}
.cell .im{aspect-ratio:1;display:grid;place-items:center;padding:8px;background-image:linear-gradient(45deg,#E4E8EF 25%,transparent 25%,transparent 75%,#E4E8EF 75%),linear-gradient(45deg,#E4E8EF 25%,transparent 25%,transparent 75%,#E4E8EF 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.cell img{max-width:100%;max-height:100%;display:block}
.cell .cap{padding:6px 8px;font-size:12px;overflow-wrap:anywhere;border-top:1px solid var(--ink)}
.cell a{display:block;text-align:center;border-top:1px solid #C3CAD6;padding:6px;color:var(--blue);text-decoration:none;font-size:13px}
dialog{border:1px solid var(--ink);border-radius:2px;padding:20px;max-width:460px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(16,24,40,.5)}
dialog h2{margin:0 0 8px;font-size:17px}
dialog .warn{font-size:13px;background:#FFF4D6;border:1px solid #D9B44A;padding:8px 10px;margin:8px 0}
@media (max-width:860px){.layout{grid-template-columns:1fr}.panel{border-inline-end:0;border-bottom:1px solid var(--ink)}.desk{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>مصنع الهويات</h1>
  <nav role="tablist" aria-label="الأقسام">
    <button role="tab" id="t-design" aria-selected="true">تصميم هوية</button>
    <button role="tab" id="t-sep" aria-selected="false">فصل العناصر</button>
  </nav>
  <button class="btn" id="keybtn">مفتاح Gemini</button>
</header>

<main id="p-design" class="layout">
  <aside class="panel">
    <div><label for="name">اسم العلامة</label><input type="text" id="name" autocomplete="off"></div>
    <div><label for="desc">وصف النشاط والجمهور</label><textarea id="desc" rows="3"></textarea></div>
    <button class="btn p" id="gen">ولّد الهوية</button>
    <p class="msg" id="gmsg"></p>

    <fieldset><legend>الألوان</legend>
      <div class="pal" id="pal"></div>
    </fieldset>

    <div class="two">
      <div><label for="hf">خط العناوين</label><select id="hf"></select></div>
      <div><label for="bf">خط النص</label><select id="bf"></select></div>
    </div>

    <div class="two">
      <div><span class="lbl">ترتيب الشعار</span>
        <div class="seg" id="seg-layout"><button data-v="horizontal">أفقي</button><button data-v="stacked">عمودي</button></div></div>
      <div><span class="lbl">شكل الأيقونة</span>
        <div class="seg" id="seg-shape"><button data-v="circle">دائرة</button><button data-v="rounded">مربع</button><button data-v="none">بلا</button></div></div>
    </div>

    <fieldset><legend>الأيقونة</legend>
      <div class="row"><input type="text" id="iq" placeholder="ابحث بالإنجليزية، مثل: coffee" dir="ltr"><button class="btn" id="isearch">ابحث</button></div>
      <label class="chk"><input type="checkbox" id="permissive" checked> تراخيص مفتوحة متساهلة فقط (MIT وApache وأمثالها)</label>
      <div id="igrid" class="igrid"></div>
      <p class="msg" id="imsg"></p>
      <p class="small" id="lic"></p>
    </fieldset>
  </aside>

  <section class="desk">
    <div class="sheet"><svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="لوحة الهوية"></svg></div>
    <ul class="els" id="els"></ul>
    <div class="row">
      <button class="btn p" id="packall">تحميل الحزمة كاملة (ZIP)</button>
      <button class="btn" id="tosep">افصل اللوحة بجيميناي</button>
    </div>
    <p class="msg" id="emsg"></p>
  </section>
</main>

<main id="p-sep" class="layout" hidden>
  <aside class="panel">
    <label class="drop" id="drop" for="file"><input type="file" id="file" accept="image/*"><span id="dropt">اسحب لوحة هوية هنا أو اضغط لاختيار صورة</span></label>
    <img id="srcprev" alt="" hidden>
    <div><label for="ask">ما الذي تريد فصله؟</label>
      <textarea id="ask" rows="3">كل عنصر مستقل في اللوحة: الشعار، الأيقونة، عينات الألوان، عينات الخطوط، البطاقات والمطبوعات.</textarea></div>
    <div><span class="lbl">طريقة القص</span>
      <div class="seg" id="seg-mode"><button data-v="mask">بالقناع (خلفية شفافة)</button><button data-v="box">بالصندوق</button></div></div>
    <button class="btn p" id="sepgo" disabled>افصل العناصر</button>
    <p class="msg" id="smsg"></p>
  </aside>
  <section class="desk">
    <div class="gal" id="gal"></div>
    <div class="row"><button class="btn p" id="zipsep" hidden>تحميل كل العناصر (ZIP)</button></div>
  </section>
</main>

<dialog id="keydlg">
  <h2>مفتاح Gemini</h2>
  <p class="small">يُحفظ المفتاح في متصفحك فقط، ويُرسل مباشرة إلى Google. لا يمر بأي خادم آخر.</p>
  <p class="warn">قيّد المفتاح من Google Cloud بنطاق موقعك (HTTP referrer) وحدد حداً يومياً للاستهلاك. أي مفتاح داخل متصفح يمكن استخراجه.</p>
  <label for="keyin">المفتاح</label>
  <input type="password" id="keyin" autocomplete="off" dir="ltr">
  <label for="modelin">النموذج</label>
  <input type="text" id="modelin" list="models" dir="ltr">
  <datalist id="models"><option value="gemini-2.5-flash"><option value="gemini-2.5-pro"><option value="gemini-3-flash-preview"></datalist>
  <label class="chk"><input type="checkbox" id="keyremember"> تذكّر المفتاح على هذا الجهاز</label>
  <p class="msg" id="kmsg"></p>
  <div class="row" style="margin-top:8px">
    <button class="btn p" id="keysave">حفظ</button>
    <button class="btn" id="keyclear">حذف المفتاح</button>
    <button class="btn" id="keyclose">إغلاق</button>
  </div>
</dialog>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=1200,H=900;
const FONTS=['Readex Pro','Cairo','Tajawal','IBM Plex Sans Arabic','Almarai','Noto Kufi Arabic','Amiri','Reem Kufi','Lalezar','El Messiri','Changa'];
const PERMISSIVE=new Set(['MIT','Apache-2.0','ISC','CC0-1.0','0BSD','Unlicense','BSD-3-Clause']);
const PKEYS=['primary','secondary','accent','light','dark'];
const PNAMES={primary:'الأساسي',secondary:'الثانوي',accent:'التمييز',light:'الفاتح',dark:'الداكن'};
const ELS=[
  {id:'el-logo',file:'logo',label:'الشعار الكامل'},
  {id:'el-mark',file:'mark',label:'الأيقونة'},
  {id:'el-wordmark',file:'wordmark',label:'اسم العلامة'},
  {id:'el-palette',file:'palette',label:'لوحة الألوان'},
  {id:'el-type',file:'typography',label:'الخطوط'},
  {id:'el-card',file:'card',label:'بطاقة الأعمال'}
];
const S={name:'',desc:'',tagline:'',palette:{primary:'#2540FF',secondary:'#101828',accent:'#FF4D8D',light:'#F4F6FA',dark:'#101828'},head:'Readex Pro',body:'Tajawal',layout:'horizontal',shape:'circle',icon:null};
const SEP={mode:'mask'};
const board=$('#board');

/* ---------- أدوات عامة ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fam=f=>`'${f}', sans-serif`;
const say=(el,msg,kind='')=>{el.textContent=msg;el.className='msg '+kind};
const storeGet=k=>{try{return localStorage.getItem(k)||sessionStorage.getItem(k)||''}catch{return''}};
const storeSet=(k,v,persist)=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k);if(v)(persist?localStorage:sessionStorage).setItem(k,v)}catch{}};
const hx=(v,f)=>{if(typeof v!=='string')return f;v=v.trim();if(/^#[0-9a-f]{6}$/i.test(v))return v.toUpperCase();if(/^#[0-9a-f]{3}$/i.test(v))return '#'+[...v.slice(1)].map(c=>c+c).join('').toUpperCase();return f};
const lum=h=>{const [r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*r+.7152*g+.0722*b};
const onColor=h=>lum(h)>.45?'#101828':'#FFFFFF';
const hsl=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()};
const safeName=s=>String(s).replace(/[\\/:*?"<>|]+/g,'-').trim()||'file';
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;try{await fn()}finally{btn.disabled=false;btn.textContent=t}}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('تعذّر تحميل الصورة'));i.src=src});
const blobToB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

/* ---------- الخطوط ---------- */
const loaded={};
function loadFont(f){
  if(loaded[f])return loaded[f];
  loaded[f]=new Promise(res=>{
    const l=document.createElement('link');l.rel='stylesheet';
    l.href=`https://fonts.googleapis.com/css2?family=${f.replace(/ /g,'+')}:wght@400;700&display=swap`;
    l.onload=async()=>{try{await Promise.all([document.fonts.load(`400 20px "${f}"`,'أبجد Abc'),document.fonts.load(`700 20px "${f}"`,'أبجد Abc')])}catch{}res()};
    l.onerror=()=>res();
    document.head.appendChild(l);
  });
  return loaded[f];
}
const fontCache={};
async function fontCSS(f){
  if(fontCache[f])return fontCache[f];
  let css=await (await fetch(`https://fonts.googleapis.com/css2?family=${f.replace(/ /g,'+')}:wght@400;700&display=swap`)).text();
  const urls=[...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))];
  for(const u of urls){const r=await fetch(u);if(!r.ok)throw new Error('font');css=css.split(u).join(await blobToB64(await r.blob()))}
  return fontCache[f]=css;
}
let fontWarned=false;
async function embedCSS(fams){
  const set=[...new Set(fams)];
  const out=await Promise.allSettled(set.map(fontCSS));
  const ok=out.filter(o=>o.status==='fulfilled');
  if(ok.length<set.length&&!fontWarned){fontWarned=true;say($('#emsg'),'تعذّر تضمين بعض الخطوط في الملف المُصدَّر. ستظهر بخط بديل خارج المتصفح.','err')}
  return ok.map(o=>o.value).join('\n');
}
const mctx=document.createElement('canvas').getContext('2d');
const tw=(text,font,weight,size)=>{mctx.font=`${weight} ${size}px "${font}", sans-serif`;return mctx.measureText(text).width};

/* ---------- الرسم ---------- */
function iconG(ic,cx,cy,size,color){
  if(!ic)return '';
  const s=size/Math.max(ic.w,ic.h);
  return `<g transform="translate(${(cx-ic.w*s/2).toFixed(2)} ${(cy-ic.h*s/2).toFixed(2)}) scale(${s.toFixed(4)})" color="${color}" fill="${color}">${ic.body}</g>`;
}
function markSVG(cx,cy,M,name){
  const P=S.palette,ch=esc([...(name||'؟')][0]);
  const mono=(size,color)=>`<text x="${cx}" y="${cy+size*.35}" text-anchor="middle" font-family="${fam(S.head)}" font-weight="700" font-size="${size}" fill="${color}">${ch}</text>`;
  if(S.shape==='none')return S.icon?iconG(S.icon,cx,cy,M,P.primary):mono(M*.8,P.primary);
  const fg=onColor(P.primary);
  const shape=S.shape==='circle'?`<circle cx="${cx}" cy="${cy}" r="${M/2}" fill="${P.primary}"/>`:`<rect x="${cx-M/2}" y="${cy-M/2}" width="${M}" height="${M}" rx="${M*.24}" fill="${P.primary}"/>`;
  return shape+(S.icon?iconG(S.icon,cx,cy,M*.52,fg):mono(M*.5,fg));
}
let rt=0;
async function render(){
  const my=++rt,P=S.palette;
  await Promise.all([loadFont(S.head),loadFont(S.body)]);
  if(my!==rt)return;
  const name=S.name||'اسم العلامة',tag=S.tagline,stacked=S.layout==='stacked',tS=28;
  let nS=stacked?72:76;
  const w0=tw(name,S.head,700,nS),maxW=stacked?900:700;
  if(w0>maxW)nS=Math.floor(nS*maxW/w0);
  const nW=tw(name,S.head,700,nS),tW=tag?tw(tag,S.body,400,tS):0;
  let mark,word;
  const nameT=(x,y,a)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="${fam(S.head)}" font-weight="700" font-size="${nS}" fill="${P.dark}">${esc(name)}</text>`;
  const tagT=(x,y,a)=>tag?`<text x="${x}" y="${y}" text-anchor="${a}" font-family="${fam(S.body)}" font-weight="400" font-size="${tS}" fill="${P.dark}" fill-opacity=".72">${esc(tag)}</text>`:'';
  if(!stacked){
    const M=150,gap=40,total=M+gap+Math.max(nW,tW),right=W/2+total/2,cy=250,tr=right-M-gap;
    mark=markSVG(right-M/2,cy,M,name);
    word=nameT(tr,cy+(tag?2:nS*.3),'end')+tagT(tr,cy+58,'end');
  }else{
    mark=markSVG(W/2,170,170,name);
    word=nameT(W/2,390,'middle')+tagT(W/2,445,'middle');
  }
  let pal='';
  PKEYS.forEach((k,i)=>{
    const x=916-i*200,c=P[k],fg=onColor(c);
    pal+=`<rect x="${x}" y="560" width="184" height="120" fill="${c}" stroke="${P.dark}" stroke-opacity=".18"/>`+
      `<text x="${x+168}" y="596" text-anchor="end" font-family="${fam(S.body)}" font-size="20" fill="${fg}">${PNAMES[k]}</text>`+
      `<text x="${x+168}" y="664" text-anchor="end" font-family="${fam(S.body)}" font-size="22" fill="${fg}">${c}</text>`;
  });
  const type=`<text x="1100" y="775" text-anchor="end" font-family="${fam(S.head)}" font-weight="700" font-size="54" fill="${P.dark}">أبجد هوز حطي</text>`+
    `<text x="1100" y="825" text-anchor="end" font-family="${fam(S.body)}" font-size="24" fill="${P.dark}">نص تجريبي بخط المتن يوضح القراءة</text>`+
    `<text x="1100" y="862" text-anchor="end" font-family="${fam(S.body)}" font-size="18" fill="${P.dark}" fill-opacity=".6">${esc(S.head)} / ${esc(S.body)}</text>`;
  const cfg=onColor(P.secondary);
  const card=`<rect x="100" y="720" width="440" height="150" fill="${P.secondary}"/>`+
    (S.icon?iconG(S.icon,480,795,64,P.accent):'')+
    `<text x="${S.icon?430:510}" y="795" text-anchor="end" font-family="${fam(S.head)}" font-weight="700" font-size="34" fill="${cfg}">${esc(name.length>16?name.slice(0,16)+'…':name)}</text>`+
    (tag?`<text x="${S.icon?430:510}" y="830" text-anchor="end" font-family="${fam(S.body)}" font-size="17" fill="${cfg}" fill-opacity=".75">${esc(tag.length>34?tag.slice(0,34)+'…':tag)}</text>`:'');
  board.innerHTML=`<rect width="${W}" height="${H}" fill="${P.light}"/>`+
    `<g id="el-logo"><g id="el-mark">${mark}</g><g id="el-wordmark">${word}</g></g>`+
    `<g id="el-palette">${pal}</g><g id="el-type">${type}</g><g id="el-card">${card}</g>`;
}

/* ---------- التصدير ---------- */
async function elSVG(id){
  const el=board.querySelector('#'+id);if(!el)return null;
  const bb=el.getBBox();if(!bb.width||!bb.height)return null;
  const pad=20,css=await embedCSS([S.head,S.body]);
  const vb=[bb.x-pad,bb.y-pad,bb.width+pad*2,bb.height+pad*2].map(n=>+n.toFixed(2));
  return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" width="${vb[2]}" height="${vb[3]}"><style>${css}</style>${el.outerHTML}</svg>`,w:vb[2],h:vb[3]};
}
async function boardSVG(){
  const css=await embedCSS([S.head,S.body]);
  return {svg:board.outerHTML.replace(/^<svg[^>]*>/,m=>m+`<style>${css}</style>`),w:W,h:H};
}
async function svgToPng(svg,w,h,scale=2){
  const u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{
    const img=await loadImg(u);
    await new Promise(r=>setTimeout(r,150));
    const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/png'));
  }finally{URL.revokeObjectURL(u)}
}

/* ---------- ZIP (بدون مكتبات) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function makeZip(files){
  const enc=new TextEncoder(),chunks=[],central=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  }
  const cd=central.reduce((a,c)=>a+c.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cd,true);end.setUint32(16,off,true);
  return new Blob([...chunks,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}

/* ---------- Gemini ---------- */
async function gem(parts,json=true){
  const key=storeGet('hf_key');if(!key)throw new Error('أضف مفتاح Gemini أولاً من زر «مفتاح Gemini».');
  const model=storeGet('hf_model')||'gemini-2.5-flash';
  const body={contents:[{parts}]};if(json)body.generationConfig={responseMimeType:'application/json'};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((d.error&&d.error.message)||('خطأ '+r.status)+(r.status===429?' — تجاوزت حد الاستخدام المجاني.':''));
  const t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
  if(!t)throw new Error('رجع الرد فارغاً'+(d.promptFeedback&&d.promptFeedback.blockReason?': '+d.promptFeedback.blockReason:''));
  return t;
}
const parseJSON=t=>JSON.parse(t.replace(/^\s*```(?:json)?\s*/i,'').replace(/\s*```\s*$/,''));

/* ---------- الأيقونات (Iconify) ---------- */
let found=[];
async function findIcons(kws,auto){
  const m=$('#imsg');say(m,'أبحث عن أيقونات…');
  try{
    const seen=new Set(),ids=[],cols={};
    for(const k of kws.slice(0,4)){
      const r=await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(k)}&limit=24`);
      if(!r.ok)throw new Error('تعذّر الوصول إلى Iconify ('+r.status+')');
      const d=await r.json();Object.assign(cols,d.collections||{});
      for(const id of d.icons||[])if(!seen.has(id)){seen.add(id);ids.push(id)}
    }
    const pre=id=>id.split(':')[0];
    const need=[...new Set(ids.map(pre).filter(p=>!cols[p]))];
    if(need.length){try{const r=await fetch(`https://api.iconify.design/collections?prefixes=${need.join(',')}`);if(r.ok)Object.assign(cols,await r.json())}catch{}}
    const strict=$('#permissive').checked;
    const keep=ids.filter(id=>!strict||PERMISSIVE.has(cols[pre(id)]&&cols[pre(id)].license&&cols[pre(id)].license.spdx)).slice(0,60);
    const by={};keep.forEach(id=>{const[p,n]=id.split(':');(by[p]=by[p]||[]).push(n)});
    const items=[];
    for(const p of Object.keys(by)){
      const r=await fetch(`https://api.iconify.design/${p}.json?icons=${by[p].join(',')}`);if(!r.ok)continue;
      const d=await r.json(),dw=d.width||16,dh=d.height||16;
      for(const n of by[p]){
        let ic=d.icons&&d.icons[n];
        if(!ic&&d.aliases&&d.aliases[n]&&d.icons[d.aliases[n].parent])ic={...d.icons[d.aliases[n].parent],...d.aliases[n]};
        if(!ic)continue;
        const c=cols[p]||{};
        items.push({id:p+':'+n,body:ic.body,w:ic.width||dw,h:ic.height||dh,lic:(c.license&&c.license.title)||'غير معروف',author:(c.author&&c.author.name)||''});
      }
    }
    found=keep.map(id=>items.find(i=>i.id===id)).filter(Boolean);
    $('#igrid').innerHTML=found.map((it,i)=>`<button class="ib" data-i="${i}" aria-pressed="false" title="${esc(it.id)} · ${esc(it.lic)}"><svg viewBox="0 0 ${it.w} ${it.h}" width="32" height="32" color="#101828" fill="#101828">${it.body}</svg></button>`).join('');
    if(!found.length){say(m,'لا نتائج. جرّب كلمة إنجليزية أخرى'+(strict?' أو أوقف فلتر التراخيص.':'.'),'err');return}
    say(m,`${found.length} أيقونة. اضغط واحدة لاعتمادها.`);
    if(auto)pick(0);
  }catch(err){say(m,err.message,'err')}
}
function pick(i){
  const it=found[i];if(!it)return;
  S.icon=it;
  $$('.ib').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  $('#lic').textContent=`${it.id} — ترخيص ${it.lic}${it.author?' — '+it.author:''}`;
  render();
}

Name: ${name}
Description: ${desc||'(not provided)'}
Return ONLY JSON in exactly this shape:
{"tagline":"Arabic tagline, at most 6 words","palette":{"primary":"#RRGGBB","secondary":"#RRGGBB","accent":"#RRGGBB","light":"#RRGGBB very light background","dark":"#RRGGBB very dark text color"},"heading_font":"one of: ${FONTS.join(', ')}","body_font":"one of the same list","icon_keywords":["3 to 5 single English nouns for a concrete visual mark for this brand"],"shape":"circle or rounded or none","layout":"horizontal or stacked"}
Rules: strong contrast between primary and light; colors must fit the sector and audience; avoid a default blue unless the brand justifies it.`;

    if(lum(S.palette.light)<.5)S.palette.light='#F4F6FA';
    if(lum(S.palette.dark)>.25)S.palette.dark='#101828';
    if(typeof d.tagline==='string')S.tagline=d.tagline.trim().slice(0,60);
    if(FONTS.includes(d.heading_font))S.head=d.heading_font;
    if(FONTS.includes(d.body_font))S.body=d.body_font;
    if(['circle','rounded','none'].includes(d.shape))S.shape=d.shape;
    if(['horizontal','stacked'].includes(d.layout))S.layout=d.layout;
    S.icon=null;syncUI();await render();
    const kws=(Array.isArray(d.icon_keywords)?d.icon_keywords:[]).map(String).filter(Boolean);
    if(kws.length){$('#iq').value=kws[0];await findIcons(kws,true)}
    say(m,'جاهزة. عدّل أي شيء يدوياً من اللوحة الجانبية.','ok');
  }catch(err){say(m,err.message,'err')}
}));

let srcImg=null,srcName='image',results=[];
async function setSource(file){
  const u=URL.createObjectURL(file);
  try{srcImg=await loadImg(u)}catch(e){say($('#smsg'),e.message,'err');return}
  srcName=safeName((file.name||'image').replace(/\.[^.]+$/,''));
  const p=$('#srcprev');p.src=u;p.hidden=false;$('#dropt').textContent='اضغط لتغيير الصورة';
  $('#sepgo').disabled=false;say($('#smsg'),'');
}

  }catch(err){say($('#emsg'),err.message,'err')}

$('#sepgo').addEventListener('click',e=>busy(e.currentTarget,async()=>{
  const m=$('#smsg');if(!srcImg)return;
  say(m,'جيميناي يحلل الصورة…');
  try{
    const iw=srcImg.naturalWidth,ih=srcImg.naturalHeight,k=Math.min(1,1280/Math.max(iw,ih));
    const c=document.createElement('canvas');c.width=Math.round(iw*k);c.height=Math.round(ih*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(srcImg,0,0,c.width,c.height);
    const b64=c.toDataURL('image/jpeg',.92).split(',')[1];
    const ask=$('#ask').value.trim()||'كل عنصر مستقل في الصورة';
    const prompt=`Give the segmentation masks for each separate design element in this image. Focus on: ${ask}
Output a JSON list where each entry contains the 2D bounding box in the key "box_2d", the segmentation mask in the key "mask", and a short descriptive text label in the key "label" (Arabic if the element contains Arabic). One entry per separate element; do not merge different elements and do not output the whole canvas.`;
    const list=parseJSON(await gem([{inline_data:{mime_type:'image/jpeg',data:b64}},{text:prompt}]));
    if(!Array.isArray(list)||!list.length)throw new Error('لم يجد جيميناي عناصر. جرّب وصفاً أدق.');
    results.forEach(r=>URL.revokeObjectURL(r.url));results=[];$('#gal').innerHTML='';
    let n=0;
    for(const it of list){
      if(!Array.isArray(it.box_2d)||it.box_2d.length<4)continue;
      const [y0,x0,y1,x1]=it.box_2d.map(Number);
      const X0=Math.max(0,Math.round(Math.min(x0,x1)/1000*iw)),X1=Math.min(iw,Math.round(Math.max(x0,x1)/1000*iw));
      const Y0=Math.max(0,Math.round(Math.min(y0,y1)/1000*ih)),Y1=Math.min(ih,Math.round(Math.max(y0,y1)/1000*ih));
      const bw=X1-X0,bh=Y1-Y0;if(bw<6||bh<6)continue;
      const cv=document.createElement('canvas');cv.width=bw;cv.height=bh;
      const cx=cv.getContext('2d');cx.drawImage(srcImg,X0,Y0,bw,bh,0,0,bw,bh);
      if(SEP.mode==='mask'&&it.mask){
        try{
          const mi=await loadImg(String(it.mask).startsWith('data:')?it.mask:'data:image/png;base64,'+it.mask);
          const mc=document.createElement('canvas');mc.width=bw;mc.height=bh;
          const mx=mc.getContext('2d');mx.drawImage(mi,0,0,bw,bh);
          const md=mx.getImageData(0,0,bw,bh).data,im=cx.getImageData(0,0,bw,bh);
          for(let i=0;i<md.length;i+=4){const a=(md[i]-96)/64;im.data[i+3]=Math.round(255*Math.max(0,Math.min(1,a)))}
          cx.putImageData(im,0,0);
        }catch{}
      }
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      n++;results.push({label:String(it.label||'عنصر '+n),blob,url:URL.createObjectURL(blob),name:`${String(n).padStart(2,'0')}-${safeName(it.label||'element')}.png`});
    }
    if(!results.length)throw new Error('لم أستطع قص أي عنصر من الرد.');
    $('#gal').innerHTML=results.map(r=>`<div class="cell"><div class="im"><img src="${r.url}" alt=""></div><div class="cap">${esc(r.label)}</div><a href="${r.url}" download="${esc(r.name)}">تحميل PNG</a></div>`).join('');
    $('#zipsep').hidden=false;
    say(m,`تم فصل ${results.length} عنصر.`,'ok');
  }catch(err){say(m,err.message,'err')}
}));
$('#zipsep').addEventListener('click',e=>busy(e.currentTarget,async()=>{
  const files=[];for(const r of results)files.push({name:r.name,data:new Uint8Array(await r.blob.arrayBuffer())});
  dl(makeZip(files),srcName+'-elements.zip');
}));
